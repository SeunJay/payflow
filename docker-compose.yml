name: payflow-lab

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PAYFLOW_DB_PASSWORD: ${PAYFLOW_DB_PASSWORD}
      SIMULATOR_DB_PASSWORD: ${SIMULATOR_DB_PASSWORD}
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data)
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9
    command:
      - valkey-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - '6379:6379'
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  valkeydata:
